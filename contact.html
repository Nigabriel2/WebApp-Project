
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeRwanda | Contact</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f1f5f9;
    padding: 40px 15px;
}

header {
    text-align: center;
    margin-bottom: 30px;
}

.logo {
    font-size: 30px;
    font-weight: bold;
    color: #2563eb;
}

header p {
    color: #64748b;
    margin-top: 10px;
}

.container {
    max-width: 650px;
    margin: auto;
    background: white;
    padding: 40px;
    border-radius: 14px;
    box-shadow: 0 10px 35px rgba(0,0,0,.07);
}

h2 {
    color: #101a35;
    margin-bottom: 25px;
}

.form-group {
    margin-bottom: 22px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 9px;
    font-size: 14px;
}

input, select, textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
    outline: none;
    font-size: 14px;
}

textarea {
    min-height: 140px;
    resize: vertical;
}

input:focus, select:focus, textarea:focus {
    border-color: #2563eb;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 7px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

.back {
    display: block;
    text-align: center;
    margin-top: 22px;
    color: #2563eb;
    text-decoration: none;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <div class="logo">CodeRwanda</div>
    <p>We would love to hear from you.</p>
</header>

<div class="container">

    <h2>Contact Our Team</h2>

    <form action="#" method="POST">

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="fullname" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label>Subject</label>
            <select name="subject" required>
                <option value="">Choose a subject</option>
                <option>General Inquiry</option>
                <option>Technical Support</option>
                <option>Registration Support</option>
                <option>Assessment Inquiry</option>
                <option>Other</option>
            </select>
        </div>

        <div class="form-group">
            <label>Your Message</label>
            <textarea name="message" placeholder="Write your message here..." required></textarea>
        </div>

        <button type="submit">Send Message</button>

    </form>

    <a class="back" href="index.html">← Back to Home</a>

</div>

</body>
</html>
