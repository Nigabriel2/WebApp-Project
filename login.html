
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeRwanda | Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: linear-gradient(135deg, #101a35, #2563eb);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-box {
    background: white;
    width: 100%;
    max-width: 430px;
    padding: 45px 35px;
    border-radius: 15px;
    box-shadow: 0 15px 40px rgba(0,0,0,.2);
}

.logo {
    text-align: center;
    color: #2563eb;
    font-size: 29px;
    font-weight: bold;
    margin-bottom: 15px;
}

h2 {
    text-align: center;
    color: #101a35;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #64748b;
    margin-bottom: 30px;
}

.form-group {
    margin-bottom: 22px;
}

label {
    display: block;
    margin-bottom: 9px;
    font-weight: bold;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
    outline: none;
}

input:focus {
    border-color: #2563eb;
}

button {
    width: 100%;
    padding: 14px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 7px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

.links {
    text-align: center;
    margin-top: 22px;
    line-height: 2;
    color: #64748b;
}

a {
    color: #2563eb;
    text-decoration: none;
    font-weight: bold;
}
</style>
</head>
<h1>login to get new skill opo<h1>
<body>

<div class="login-box">

    <div class="logo">CodeRwanda</div>

    <h2>Welcome Back</h2>

    <p class="subtitle">Login to access your account.</p>

    <form action="#" method="POST">

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Enter your password" required>
        </div>

        <button type="submit">Login to Account</button>

    </form>

    <div class="links">
        <p>Don't have an account?</p>
        <a href="registration.html">Create Account</a>
        <br>
        <a href="index.html">← Back to Home</a>
    </div>

</div>

</body>
</html>
